<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊分帳小幫手</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        ✈️ 旅遊分帳小幫手
      </h1>
      <button id="btnCreateTrip" class="bg-indigo-500 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition cursor-pointer">
        + 新建旅行
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6">
    <div id="tripTabs" class="flex gap-2 overflow-x-auto pb-2 border-b border-slate-200 mb-6"></div>

    <div id="appContent" class="space-y-6">
      
      <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
          <div>
            <span id="syncModeTag" class="text-xs font-semibold text-indigo-600 uppercase tracking-wider">目前旅行</span>
            <h2 id="currentTripName" class="text-2xl font-bold text-slate-800">載入中...</h2>
          </div>
          <div class="flex flex-wrap gap-2">
            <button id="btnCopyShare" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-1.5 rounded transition flex items-center gap-1 cursor-pointer">
              🔗 複製邀請連結 (即時同步)
            </button>
            <button id="btnExport" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded transition cursor-pointer">匯出 JSON</button>
            <button id="btnDeleteTrip" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded transition cursor-pointer">刪除此旅行</button>
          </div>
        </div>

        <div class="border-t pt-4">
          <label class="block text-sm font-medium text-slate-600 mb-2">同行成員（名單）：</label>
          <div id="memberTags" class="flex flex-wrap gap-2 mb-3"></div>
          <div class="flex gap-2 max-w-sm">
            <input type="text" id="newMemberName" placeholder="輸入成員名稱" class="flex-1 border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button id="btnAddMember" class="bg-slate-800 text-white text-sm px-4 py-1.5 rounded-lg hover:bg-slate-700 transition cursor-pointer">新增成員</button>
          </div>
        </div>
      </section>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
          <p class="text-xs text-slate-500">總支出金額</p>
          <p id="totalExpense" class="text-2xl font-bold text-indigo-600">NT$ 0</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
          <p class="text-xs text-slate-500">人均消費估算</p>
          <p id="perPersonExpense" class="text-2xl font-bold text-emerald-600">NT$ 0</p>
        </div>
      </div>

      <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
        <h3 class="font-bold text-lg mb-4 text-slate-800 flex items-center gap-2">📝 記一筆款項</h3>
        <form id="expenseForm" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">墊付項目名稱</label>
              <input type="text" id="itemName" required placeholder="例如：晚餐、計程車" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">墊付金額 ($)</label>
              <input type="number" id="itemAmount" required min="1" placeholder="例如：1200" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">先墊付者</label>
              <select id="payerSelect" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white"></select>
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-xs font-medium text-slate-600">幫哪些人墊付（分攤人）</label>
              <button type="button" id="btnToggleAllBeneficiaries" class="text-xs text-indigo-600 hover:underline cursor-pointer">全選 / 全不選</button>
            </div>
            <div id="beneficiariesCheckboxes" class="flex flex-wrap gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200"></div>
          </div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition text-sm cursor-pointer">
            新增這筆費用
          </button>
        </form>
      </section>

      <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
        <h3 class="font-bold text-lg mb-4 text-slate-800">📋 花費明細</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-50 text-slate-700 uppercase text-xs">
              <tr>
                <th class="py-3 px-3">項目</th>
                <th class="py-3 px-3">金額</th>
                <th class="py-3 px-3">墊付者</th>
                <th class="py-3 px-3">分攤人</th>
                <th class="py-3 px-3 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="expenseTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>

      <section class="bg-gradient-to-br from-indigo-50 to-slate-50 p-5 rounded-xl border border-indigo-100 shadow-sm">
        <h3 class="font-bold text-lg mb-2 text-indigo-950 flex items-center gap-2">💡 最終結算方案（最佳化轉帳）</h3>
        <p class="text-xs text-slate-500 mb-4">系統已自動計算淨額，並透過演算法簡化轉帳流程以減少次數。</p>
        <div id="settlementResult" class="space-y-2"></div>
      </section>

    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ▼▼▼ 請將這一段替換成你在 Firebase Console 複製的真實配置 ▼▼▼
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "123456789",
      appId: "YOUR_APP_ID"
    };
    // ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

    const isFirebaseConfigured = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";
    let db = null;

    if (isFirebaseConfigured) {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    }

    const defaultTrips = [
      {
        id: 'trip_default',
        name: '東京 5 天 4 夜自由行',
        members: ['小明', '小美', '阿豪'],
        expenses: [
          { id: 'exp_1', name: '成田機場快線車票', amount: 3000, payer: '小明', beneficiaries: ['小明', '小美', '阿豪'] }
        ]
      }
    ];

    let trips = [];
    let currentTripId = '';
    let unsubscribeCloud = null;

    function safeBtoa(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
    }

    function safeAtob(str) {
      return decodeURIComponent(Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    }

    function getCurrentTrip() {
      return trips.find(t => t.id === currentTripId) || trips[0];
    }

    function init() {
      const tag = document.getElementById('syncModeTag');
      bindEvents();

      if (isFirebaseConfigured) {
        tag.innerText = "目前旅行 (Firebase 雲端同步中)";
        initFirebase();
      } else {
        tag.innerText = "目前旅行 (本地儲存模式)";
        initLocal();
      }
    }

    // --- 本地模式邏輯 ---
    function initLocal() {
      const hash = window.location.hash;
      if (hash.startsWith('#data=')) {
        try {
          const jsonStr = safeAtob(hash.replace('#data=', ''));
          const sharedTrip = JSON.parse(jsonStr);
          trips = JSON.parse(localStorage.getItem('travel_split_trips')) || defaultTrips;
          const idx = trips.findIndex(t => t.id === sharedTrip.id);
          if (idx !== -1) trips[idx] = sharedTrip;
          else trips.unshift(sharedTrip);
          currentTripId = sharedTrip.id;
          saveLocal();
        } catch (e) {
          window.history.replaceState(null, '', window.location.pathname);
          loadLocal();
        }
      } else {
        loadLocal();
      }
      render();
    }

    function loadLocal() {
      trips = JSON.parse(localStorage.getItem('travel_split_trips')) || defaultTrips;
      currentTripId = trips[0]?.id || 'trip_default';
    }

    function saveLocal() {
      localStorage.setItem('travel_split_trips', JSON.stringify(trips));
      const trip = getCurrentTrip();
      if (trip) {
        try {
          window.history.replaceState(null, '', `#data=${safeBtoa(JSON.stringify(trip))}`);
        } catch(e) {}
      }
    }

    // --- Firebase 雲端模式邏輯 ---
    function initFirebase() {
      const urlParams = new URLSearchParams(window.location.search);
      currentTripId = urlParams.get('trip');

      if (!currentTripId) {
        currentTripId = 'trip_' + Date.now();
        window.history.replaceState(null, '', `?trip=${currentTripId}`);
      }

      listenToCloudTrip(currentTripId);
    }

    function listenToCloudTrip(tripId) {
      if (unsubscribeCloud) unsubscribeCloud();

      unsubscribeCloud = onSnapshot(doc(db, "trips", tripId), (docSnap) => {
        if (docSnap.exists()) {
          trips = [docSnap.data()];
        } else {
          const newTrip = { id: tripId, name: '新旅行', members: ['成員A', '成員B'], expenses: [] };
          trips = [newTrip];
          saveFirebase();
        }
        render();
      }, (error) => {
        console.error("Firebase 讀取失敗:", error);
      });
    }

    function saveFirebase() {
      const trip = getCurrentTrip();
      if (trip && currentTripId) {
        setDoc(doc(db, "trips", currentTripId), trip);
      }
    }

    function saveData() {
      if (isFirebaseConfigured) saveFirebase();
      else saveLocal();
    }

    // --- 界面渲染 ---
    function render() {
      const trip = getCurrentTrip();
      if (!trip) return;

      document.getElementById('currentTripName').innerText = trip.name;
      renderTabs();
      renderTripDetails();
      renderExpenseTable();
      renderSettlement();
    }

    function renderTabs() {
      const tabs = document.getElementById('tripTabs');
      if (isFirebaseConfigured) {
        tabs.style.display = 'none';
        return;
      }
      tabs.style.display = 'flex';
      tabs.innerHTML = trips.map(t => `
        <button data-trip-id="${t.id}" class="btn-switch-trip px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition cursor-pointer ${t.id === currentTripId ? 'bg-indigo-600 text-white shadow' : 'bg-white text-slate-600 hover:bg-slate-100'}">
          ${t.name}
        </button>
      `).join('');

      document.querySelectorAll('.btn-switch-trip').forEach(btn => {
        btn.onclick = () => {
          currentTripId = btn.getAttribute('data-trip-id');
          render();
        };
      });
    }

    function renderTripDetails() {
      const trip = getCurrentTrip();
      const memberContainer = document.getElementById('memberTags');
      memberContainer.innerHTML = trip.members.map(m => `
        <span class="inline-flex items-center gap-1 bg-slate-100 text-slate-700 text-xs font-medium px-2.5 py-1 rounded-full border border-slate-200">
          ${m}
          <button data-member="${m}" class="btn-remove-member text-slate-400 hover:text-rose-500 font-bold ml-1 cursor-pointer">&times;</button>
        </span>
      `).join('');

      document.querySelectorAll('.btn-remove-member').forEach(btn => {
        btn.onclick = () => removeMember(btn.getAttribute('data-member'));
      });

      document.getElementById('payerSelect').innerHTML = trip.members.map(m => `<option value="${m}">${m}</option>`).join('');

      document.getElementById('beneficiariesCheckboxes').innerHTML = trip.members.map(m => `
        <label class="inline-flex items-center gap-1.5 text-sm font-medium cursor-pointer">
          <input type="checkbox" name="beneficiary" value="${m}" checked class="rounded text-indigo-600 focus:ring-indigo-500">
          ${m}
        </label>
      `).join('');

      const total = trip.expenses.reduce((sum, e) => sum + Number(e.amount), 0);
      document.getElementById('totalExpense').innerText = `NT$ ${total.toLocaleString()}`;
      document.getElementById('perPersonExpense').innerText = `NT$ ${trip.members.length ? Math.round(total / trip.members.length).toLocaleString() : 0}`;
    }

    function renderExpenseTable() {
      const trip = getCurrentTrip();
      const tbody = document.getElementById('expenseTableBody');
      if (!trip.expenses || trip.expenses.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">目前尚無消費紀錄</td></tr>`;
        return;
      }

      tbody.innerHTML = trip.expenses.map(exp => `
        <tr class="hover:bg-slate-50 transition">
          <td class="py-3 px-3 font-medium text-slate-800">${exp.name}</td>
          <td class="py-3 px-3 font-bold text-indigo-600">NT$ ${exp.amount.toLocaleString()}</td>
          <td class="py-3 px-3"><span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded text-xs">${exp.payer}</span></td>
          <td class="py-3 px-3 text-xs text-slate-500">${exp.beneficiaries.join(', ')}</td>
          <td class="py-3 px-3 text-right">
            <button data-exp-id="${exp.id}" class="btn-delete-expense text-rose-500 hover:text-rose-700 text-xs font-medium cursor-pointer">刪除</button>
          </td>
        </tr>
      `).join('');

      document.querySelectorAll('.btn-delete-expense').forEach(btn => {
        btn.onclick = () => deleteExpense(btn.getAttribute('data-exp-id'));
      });
    }

    function renderSettlement() {
      const trip = getCurrentTrip();
      const container = document.getElementById('settlementResult');
      if (!trip.members || trip.members.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-sm">請先建立成員。</p>`;
        return;
      }

      const balances = {};
      trip.members.forEach(m => balances[m] = 0);

      trip.expenses.forEach(exp => {
        const split = exp.amount / exp.beneficiaries.length;
        balances[exp.payer] = (balances[exp.payer] || 0) + exp.amount;
        exp.beneficiaries.forEach(b => balances[b] = (balances[b] || 0) - split);
      });

      let debtors = [], creditors = [];
      Object.keys(balances).forEach(m => {
        const amt = Math.round(balances[m]);
        if (amt < -1) debtors.push({ name: m, amount: -amt });
        else if (amt > 1) creditors.push({ name: m, amount: amt });
      });

      let tx = [];
      let i = 0, j = 0;
      while (i < debtors.length && j < creditors.length) {
        let payment = Math.min(debtors[i].amount, creditors[j].amount);
        tx.push({ from: debtors[i].name, to: creditors[j].name, amount: payment });
        debtors[i].amount -= payment;
        creditors[j].amount -= payment;
        if (debtors[i].amount <= 1) i++;
        if (creditors[j].amount <= 1) j++;
      }

      if (tx.length === 0) {
        container.innerHTML = `<p class="text-emerald-600 font-medium text-sm">🎉 太棒了！目前大家都結清了，互不相欠！</p>`;
        return;
      }

      container.innerHTML = tx.map(t => `
        <div class="flex items-center justify-between bg-white p-3 rounded-lg border border-slate-200 shadow-sm text-sm">
          <div class="flex items-center gap-2">
            <span class="font-bold text-slate-800">${t.from}</span>
            <span class="text-xs text-slate-400">應給</span>
            <span class="font-bold text-indigo-600">${t.to}</span>
          </div>
          <span class="font-extrabold text-slate-900 text-base">NT$ ${t.amount.toLocaleString()}</span>
        </div>
      `).join('');
    }

    // --- 事件處理函式 ---
    function removeMember(name) {
      const trip = getCurrentTrip();
      trip.members = trip.members.filter(m => m !== name);
      saveData();
      render();
    }

    function deleteExpense(expId) {
      const trip = getCurrentTrip();
      trip.expenses = trip.expenses.filter(e => e.id !== expId);
      saveData();
      render();
    }

    function bindEvents() {
      document.getElementById('btnCreateTrip').onclick = async () => {
        const name = prompt('請輸入新旅行的名稱：', '新旅行');
        if (!name) return;

        const newTripId = 'trip_' + Date.now();
        if (isFirebaseConfigured) {
          const newTripData = { id: newTripId, name: name, members: ['成員A', '成員B'], expenses: [] };
          await setDoc(doc(db, "trips", newTripId), newTripData);
          window.location.search = `?trip=${newTripId}`;
        } else {
          const newTrip = { id: newTripId, name: name, members: ['成員A', '成員B'], expenses: [] };
          trips.unshift(newTrip);
          currentTripId = newTripId;
          saveData();
          render();
        }
      };

      document.getElementById('btnDeleteTrip').onclick = async () => {
        if (!isFirebaseConfigured && trips.length <= 1) {
          alert('請至少保留一個旅行記錄！');
          return;
        }
        if (confirm(`確定要刪除「${getCurrentTrip().name}」嗎？`)) {
          if (isFirebaseConfigured) {
            await deleteDoc(doc(db, "trips", currentTripId));
            window.location.search = `?trip=trip_${Date.now()}`;
          } else {
            trips = trips.filter(t => t.id !== currentTripId);
            currentTripId = trips[0].id;
            saveData();
            render();
          }
        }
      };

      document.getElementById('btnAddMember').onclick = () => {
        const input = document.getElementById('newMemberName');
        const name = input.value.trim();
        const trip = getCurrentTrip();
        if (!name || trip.members.includes(name)) return;
        trip.members.push(name);
        input.value = '';
        saveData();
        render();
      };

      document.getElementById('btnToggleAllBeneficiaries').onclick = () => {
        const cbs = document.querySelectorAll('input[name="beneficiary"]');
        const all = Array.from(cbs).every(cb => cb.checked);
        cbs.forEach(cb => cb.checked = !all);
      };

      document.getElementById('expenseForm').onsubmit = (e) => {
        e.preventDefault();
        const trip = getCurrentTrip();
        const name = document.getElementById('itemName').value;
        const amount = Number(document.getElementById('itemAmount').value);
        const payer = document.getElementById('payerSelect').value;
        const beneficiaries = Array.from(document.querySelectorAll('input[name="beneficiary"]:checked')).map(cb => cb.value);

        if (beneficiaries.length === 0) {
          alert('請至少勾選一個分攤人！');
          return;
        }

        trip.expenses.push({ id: 'exp_' + Date.now(), name, amount, payer, beneficiaries });
        document.getElementById('itemName').value = '';
        document.getElementById('itemAmount').value = '';
        saveData();
        render();
      };

      document.getElementById('btnCopyShare').onclick = () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          alert('🎉 連結已複製！傳給朋友開啟即可共同編輯與即時同步。');
        });
      };

      document.getElementById('btnExport').onclick = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(getCurrentTrip(), null, 2));
        const a = document.createElement('a');
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `travel_expenses_${Date.now()}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
      };
    }

    init();
  </script>
</body>
</html>
